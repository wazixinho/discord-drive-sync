name: Sync Discord to Drive

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (use */15 only on a public repo)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: discord-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_NAME: ${{ vars.DRIVE_ROOT_FOLDER_NAME }}
          CHANNEL_DENYLIST: ${{ vars.CHANNEL_DENYLIST }}
          CATEGORY_ALLOWLIST: ${{ vars.CATEGORY_ALLOWLIST }}
          ALLOWED_EXTENSIONS: ${{ vars.ALLOWED_EXTENSIONS }}
          EXCLUDED_EXTENSIONS: ${{ vars.EXCLUDED_EXTENSIONS }}
          EXCLUDE_MEDIA: ${{ vars.EXCLUDE_MEDIA }}
        run: python sync.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sync state"
            git pull --rebase --autostash origin main
            git push
          fi
